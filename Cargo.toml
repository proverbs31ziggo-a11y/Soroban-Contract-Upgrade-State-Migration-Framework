[workspace]
resolver = "2"
members = [
    "crates/soroban-migrate",
    "crates/soroban-migrate-schema",
    "crates/soroban-migrate-macros",
    "crates/soroban-migrate-cli",
    "examples/vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0"
repository = "https://github.com/soroban-migrate/soroban-migrate"
homepage = "https://github.com/soroban-migrate/soroban-migrate"
authors = ["The soroban-migrate authors"]

[workspace.dependencies]
soroban-migrate = { version = "0.1.0", path = "crates/soroban-migrate" }
soroban-migrate-macros = { version = "0.1.0", path = "crates/soroban-migrate-macros" }
soroban-migrate-schema = { version = "0.1.0", path = "crates/soroban-migrate-schema" }
soroban-sdk = "28.0.0-rc.1"
serde_yaml = "0.9"
tempfile = "3"
trybuild = "1"
soroban-env-host = "=28.0.2"
stellar-xdr = { version = "28.0.0", features = ["std", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# Soroban contracts must be built with overflow checks on and as small as
# possible. Use `cargo build --profile contract --target wasm32-unknown-unknown`.
[profile.contract]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
