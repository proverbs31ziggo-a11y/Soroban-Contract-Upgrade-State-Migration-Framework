[workspace]
resolver = "2"
members = [
    "crates/soroban-migrate",
    "crates/soroban-migrate-schema",
    "crates/soroban-migrate-macros",
    "crates/soroban-migrate-cli",
    "examples/vault",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91.0"
license = "Apache-2.0"
repository = "https://github.com/soroban-migrate/soroban-migrate"
homepage = "https://github.com/soroban-migrate/soroban-migrate"
authors = ["The soroban-migrate authors"]

[workspace.dependencies]
soroban-migrate = { version = "0.1.0", path = "crates/soroban-migrate" }
soroban-migrate-macros = { version = "0.1.0", path = "crates/soroban-migrate-macros" }
soroban-migrate-schema = { version = "0.1.0", path = "crates/soroban-migrate-schema" }
soroban-sdk = "28.0.0-rc.1"
serde_yaml = "0.9"
tempfile = "3"
trybuild = "1"
soroban-env-host = "=28.0.2"
stellar-xdr = { version = "28.0.0", features = ["std", "serde"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }

# Soroban contracts must be built with overflow checks on and as small as
# possible.
#
# Build a deployable artifact with `stellar contract build`, not plain `cargo
# build`. Three requirements are enforced rather than advisory:
#
#   * The compiler must be one `stellar contract build` accepts. It refuses
#     1.91.0 outright, and rejects 1.82 through 1.83, because those compilers
#     miscompile Wasm. This workspace's `rust-version` is therefore not the
#     version that builds the contract; see README.md, "Verifying it".
#   * The target must be `wasm32v1-none`. `wasm32-unknown-unknown` is rejected
#     outright on Rust 1.82+, which enables reference-types and multi-value that
#     the Soroban host does not support.
#   * The build system must mark the contract spec so it can be shaken down. A
#     contract built without that step links and exports correctly but carries an
#     unshaken spec, so its public interface is wrong even though the Wasm is not.
#
# `cargo build --target wasm32v1-none` therefore only tells you the code compiles
# for the host; it does not produce something to deploy.
#
# Note that `stellar contract build` builds the `release` profile below, not
# `[profile.contract]`; pass `--profile contract` for the smaller artifact.
[profile.contract]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = "symbols"
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
overflow-checks = true
